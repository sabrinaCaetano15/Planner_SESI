<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Eventos - Jogos Escolares</title>
<link rel="stylesheet" href="style.css">

<script>
(function() {
    if (localStorage.getItem("temaEscuro") === "ativo") {
        document.documentElement.setAttribute("data-theme", "dark");
    }
})();

function toggleDarkMode() {
    const html = document.documentElement;
    const btn = document.getElementById("darkModeBtn");

    if (html.getAttribute("data-theme") === "dark") {
        html.removeAttribute("data-theme");
        localStorage.setItem("temaEscuro", "inativo");
        btn.innerText = "🌙";
    } else {
        html.setAttribute("data-theme", "dark");
        localStorage.setItem("temaEscuro", "ativo");
        btn.innerText = "☀️";
    }
}
</script>

<style>
/* =========================
   EXTRAS VISUAIS DO PAINEL
========================= */

.btn-excluir-evento{
    background:#1e293b;
    color:white;
    border:none;
    padding:10px 14px;
    border-radius:12px;
    font-weight:800;
    cursor:pointer;
    transition:0.3s;
    width:100%;
}

.btn-excluir-evento:hover{
    background:#0f172a;
    transform: translateY(-2px);
}

.event-card{
    transition:0.3s ease;
}

.event-card:hover{
    transform: translateY(-6px);
}

.event-banner{
    position:relative;
    font-size:1.4rem;
    letter-spacing:0.5px;
}

.event-body{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.event-info{
    background:var(--bg-light);
    padding:8px 12px;
    border-radius:10px;
    font-size:0.9rem;
}

.event-title{
    font-size:1.3rem;
    font-weight:900;
    color:var(--text-main);
}

/* FORMULÁRIO MAIS MODERNO */
.form-box input{
    border-radius:12px;
    border:2px solid var(--border-color);
    padding:12px;
    transition:0.3s;
}

.form-box input:focus{
    border-color:var(--vermelho);
    box-shadow:0 0 0 4px var(--vermelho-light);
}

.btn-criar-evento{
    background:var(--vermelho);
    color:white;
    border:none;
    padding:12px;
    border-radius:12px;
    font-weight:900;
    cursor:pointer;
    transition:0.3s;
}

.btn-criar-evento:hover{
    background:var(--vermelho-dark);
    transform:translateY(-2px);
}

.actions-evento{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.actions-evento button{
    flex:1;
}
</style>
</head>

<body>

<header>
    🏆 Torneios e Jogos Escolares
    <button onclick="toggleDarkMode()" class="dark-mode-toggle" id="darkModeBtn">🌙</button>
</header>

<div class="container">

    <div class="header-actions">
        <div>Gerencie e participe dos eventos escolares</div>
    </div>

    <!-- PAINEL PROFESSOR -->
    <div id="painelProfessorEventos" class="list" style="display:none;margin-bottom:20px;">

        <h3 style="margin-bottom:15px;font-weight:900;color:var(--text-main)">
            ⚙️ Gerenciar Eventos
        </h3>

        <div class="form-box">

            <input id="novoEventoNome" placeholder="Nome do evento">
            <input id="novoEventoPeriodo" placeholder="Período">
            <input id="novoEventoLocal" placeholder="Local">

            <button class="btn-criar-evento" onclick="adicionarEvento()">
                + Criar Evento
            </button>

        </div>
    </div>

    <!-- LISTA -->
    <div class="events-grid" id="listaEventos"></div>

</div>

<script>

function obterEventos(){
    let eventos = JSON.parse(localStorage.getItem("eventosSistema"));

    if(!eventos){
        eventos = [
            {id:1,nome:"Interclasse",periodo:"10 a 20 Junho",local:"Sesi",cor:"#dc2626",icone:"⚽"},
            {id:2,nome:"Intersesi",periodo:"15 a 18 Setembro",local:"Araras",cor:"#0284c7",icone:"🏀"}
        ];
        localStorage.setItem("eventosSistema",JSON.stringify(eventos));
    }

    return eventos;
}

function renderEventos(){

    const container = document.getElementById("listaEventos");
    const eventos = obterEventos();
    const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));

    container.innerHTML = "";

    eventos.forEach(e => {

        container.innerHTML += `
        <div class="event-card">

            <div class="event-banner" style="background:${e.cor}">
                ${e.icone} ${e.nome}
                <span class="event-badge">ABERTO</span>
            </div>

            <div class="event-body">

                <div class="event-title">${e.nome}</div>

                <div class="event-info">📅 ${e.periodo}</div>
                <div class="event-info">📍 ${e.local}</div>

                <button class="btn-inscrever"
                        style="background:${e.cor}"
                        onclick="selecionarEvento('${e.nome}')">
                    Participar
                </button>

                ${
                    usuario?.tipo === "professor"
                    ? `
                    <div class="actions-evento">

                        <button class="btn-logout"
                                onclick="editarEvento(${e.id})">
                            ✏️ Editar
                        </button>

                        <button class="btn-excluir-evento"
                                onclick="excluirEvento(${e.id})">
                            🗑 Excluir
                        </button>

                    </div>`
                    : ""
                }

            </div>
        </div>`;
    });
}

function adicionarEvento(){

    const nome = document.getElementById("novoEventoNome").value.trim();
    const periodo = document.getElementById("novoEventoPeriodo").value.trim();
    const local = document.getElementById("novoEventoLocal").value.trim();

    if(!nome || !periodo || !local){
        alert("Preencha tudo!");
        return;
    }

    const eventos = obterEventos();

    eventos.push({
        id:Date.now(),
        nome,
        periodo,
        local,
        cor:"#dc2626",
        icone:"🏆"
    });

    localStorage.setItem("eventosSistema",JSON.stringify(eventos));
    renderEventos();

    document.getElementById("novoEventoNome").value="";
    document.getElementById("novoEventoPeriodo").value="";
    document.getElementById("novoEventoLocal").value="";
}

function editarEvento(id){

    const eventos = obterEventos();
    const e = eventos.find(x=>x.id===id);
    if(!e) return;

    const nome = prompt("Nome:",e.nome);
    const periodo = prompt("Período:",e.periodo);
    const local = prompt("Local:",e.local);

    if(!nome || !periodo || !local) return;

    e.nome = nome;
    e.periodo = periodo;
    e.local = local;

    localStorage.setItem("eventosSistema",JSON.stringify(eventos));
    renderEventos();
}

function excluirEvento(id){

    if(!confirm("Excluir evento?")) return;

    let eventos = obterEventos();
    const ev = eventos.find(e=>e.id===id);

    eventos = eventos.filter(e=>e.id!==id);

    localStorage.setItem("eventosSistema",JSON.stringify(eventos));

    let atletas = JSON.parse(localStorage.getItem("atletasInscritos")) || [];
    atletas = atletas.filter(a=>a.evento!==ev.nome);
    localStorage.setItem("atletasInscritos",JSON.stringify(atletas));

    const placares = JSON.parse(localStorage.getItem("bancoPlacaresJogos")) || {};
    Object.keys(placares).forEach(k=>{
        if(k.startsWith(ev.nome+"_")) delete placares[k];
    });
    localStorage.setItem("bancoPlacaresJogos",JSON.stringify(placares));

    renderEventos();
}

function selecionarEvento(nome){
    localStorage.setItem("eventoSelecionado",nome);
    window.location.href="index.html";
}

document.addEventListener("DOMContentLoaded",()=>{

    const u = JSON.parse(localStorage.getItem("usuarioLogado"));
    if(u?.tipo==="professor"){
        document.getElementById("painelProfessorEventos").style.display="block";
    }

    renderEventos();
});

</script>

</body>
</html>
