<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Eventos - Jogos Escolares</title>

<link rel="stylesheet" href="style.css">

<script>
(function () {
    if (localStorage.getItem("temaEscuro") === "ativo") {
        document.documentElement.setAttribute("data-theme", "dark");
    }
})();

function toggleDarkMode() {

    const html = document.documentElement;
    const btn = document.getElementById("darkModeBtn");

    if (html.getAttribute("data-theme") === "dark") {

        html.removeAttribute("data-theme");
        localStorage.setItem("temaEscuro", "inativo");
        btn.innerText = "🌙";

    } else {

        html.setAttribute("data-theme", "dark");
        localStorage.setItem("temaEscuro", "ativo");
        btn.innerText = "☀️";

    }

}
</script>

<style>

.btn-excluir-evento{
    background:#1e293b;
    color:#fff;
    border:none;
    padding:10px;
    border-radius:12px;
    cursor:pointer;
    width:100%;
}

.btn-excluir-evento:hover{
    transform:translateY(-2px);
}

.actions-evento{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.actions-evento button{
    flex:1;
}

</style>

</head>

<body>

<header>

🏆 Torneios e Jogos Escolares

<button
onclick="toggleDarkMode()"
class="dark-mode-toggle"
id="darkModeBtn">
🌙
</button>

</header>

<div class="container">

<div
id="painelProfessorEventos"
class="list"
style="display:none;margin-bottom:25px;">

<h3>⚙️ Gerenciar Eventos</h3>

<div class="form-box form-eventos">

    <div class="card-form grande">

        <h3>🏆 Informações Gerais</h3>

        <div class="campo">

            <label>Nome do Evento</label>

            <input
                id="novoEventoNome"
                placeholder="Ex.: Jogos Escolares SESI">

        </div>

        <div class="campo">

            <label>Local</label>

            <input
                id="novoEventoLocal"
                placeholder="Ex.: Ginásio Poliesportivo">

        </div>

        <div class="campo">

            <label>Descrição / Avisos</label>

            <textarea
                id="novaDescricao"
                rows="5"
                placeholder="Ex.:&#10;• Comparecer 30 minutos antes;&#10;• Utilizar uniforme completo;&#10;• Levar documento com foto;">
            </textarea>

        </div>

    </div>

    <div class="datas-grid">

        <div class="card-form">

            <h3>📝 Inscrições</h3>

            <div class="campo">

                <label>Início</label>

                <input
                    type="date"
                    id="inscricaoInicio">

            </div>

            <div class="campo">

                <label>Encerramento</label>

                <input
                    type="date"
                    id="inscricaoFim">

            </div>

        </div>

        <div class="card-form">

            <h3>📅 Evento</h3>

            <div class="campo">

                <label>Início</label>

                <input
                    type="date"
                    id="novoEventoInicio">

            </div>

            <div class="campo">

                <label>Encerramento</label>

                <input
                    type="date"
                    id="novoEventoFim">

            </div>

        </div>

    </div>

    <div class="acoes-evento-form">

        <button
            id="btnSalvarEvento"
            class="btn-criar-evento"
            onclick="adicionarEvento()">

            + Criar Evento

        </button>

    </div>

</div>

</div>

<div
class="events-grid"
id="listaEventos">
</div>

</div>

<script>
    const eventoSelecionado = JSON.parse(localStorage.getItem("eventoSelecionado"));

if (!eventoSelecionado) {

    alert("Selecione um evento para continuar.");

    window.location.href = "eventos.html";

}
function formatarDataBR(data){

    if(!data) return "-";

    const partes = data.split("-");

    return `${partes[2]}/${partes[1]}/${partes[0]}`;

}
function calcularStatusInscricao(inicio, fim){

    if(!inicio || !fim){

        return {
            texto: "DATAS NÃO DEFINIDAS",
            classe: "status-breve",
            aberto: false
        };

    }

    const hoje = new Date();
    hoje.setHours(0,0,0,0);

    const inicioInscricao = new Date(inicio + "T00:00:00");
    const fimInscricao = new Date(fim + "T23:59:59");

    if(hoje < inicioInscricao){

        return {
            texto: "INSCRIÇÕES EM BREVE",
            classe: "status-breve",
            aberto: false
        };

    }

    if(hoje > fimInscricao){

        return {
            texto: "INSCRIÇÕES ENCERRADAS",
            classe: "status-encerrado",
            aberto: false
        };

    }

    return {
        texto: "INSCRIÇÕES ABERTAS",
        classe: "status-aberto",
        aberto: true
    };

}
async function obterEventos(){

    const resposta = await fetch("eventos.php");

    const dados = await resposta.json();

    console.log(dados);

    return dados.map(e => ({

        id: e.id,

        nome: e.nome,

        descricao: e.descricao,

        local: e.local,

        inicio_inscricao: e.inicio_inscricao,

        fim_inscricao: e.fim_inscricao,

        data_inicio: e.data_inicio,

        data_fim: e.data_fim,

        periodoInscricao:
            `${formatarDataBR(e.inicio_inscricao)} até ${formatarDataBR(e.fim_inscricao)}`,

        periodoEvento:
            `${formatarDataBR(e.data_inicio)} até ${formatarDataBR(e.data_fim)}`,

        cor:"#dc2626",

        icone:"🏆"

    }));

}

async function renderEventos(){

    const container = document.getElementById("listaEventos");

    const eventos = await obterEventos();

    const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));

    container.innerHTML = "";

    eventos.forEach(e => {
        
        console.log(e);

        const status = calcularStatusInscricao(
        e.inicio_inscricao,
        e.fim_inscricao
    );

    console.log("Status inscrição:", status);

        container.innerHTML += `

<div class="event-card">

    <div class="event-banner" style="background:${e.cor}">
        ${e.icone} ${e.nome}
        <span class="event-badge ${status.classe}">
            ${status.texto}
        </span>
    </div>

    <div class="event-body">

        <div class="event-title">${e.nome}</div>

        <div class="event-info">
📝 <strong>Inscrições</strong><br>
${e.periodoInscricao}
</div>

<div class="event-info">
🏆 <strong>Período do Evento</strong><br>
${e.periodoEvento}
</div>

        <div class="event-info">
            📍 ${e.local}
        </div>

        ${e.descricao ? `

<div class="event-info">
    📝 ${e.descricao}
</div>

` : ""}

        <button
    class="btn-inscrever"
    style="background:${status.aberto ? e.cor : "#9ca3af"}"
    ${status.aberto ? `onclick="selecionarEvento(${e.id},'${e.nome}')"` : "disabled"}>

    ${
        status.aberto
            ? "Participar"
            : status.texto
    }

</button>

        ${usuario?.tipo==="professor" ? `

        <div class="actions-evento">

            <button
                class="btn-logout"
                onclick="editarEvento(${e.id})">

                ✏️ Editar

            </button>

            <button
                class="btn-excluir-evento"
                onclick="excluirEvento(${e.id})">

                🗑 Excluir

            </button>

        </div>

        ` : ""}

    </div>

</div>

`;

    });

}

async function selecionarEvento(id, nome) {

    const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));

    if (!usuario) {

        alert("Faça login para participar do evento.");
        window.location.href = "login.html";
        return;

    }

    const resposta = await fetch("api.php", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            acao: "inscreverEvento",

            id_usuario: usuario.id,

            id_evento: id

        })

    });

    const retorno = await resposta.json();

    if (!retorno.sucesso) {

        alert(retorno.mensagem);
        return;

    }

    localStorage.setItem("eventoSelecionado", JSON.stringify({
        id: id,
        nome: nome
    }));

    window.location.href = "index.html";

}
async function editarEvento(id){

    const eventos = await obterEventos();

    const evento = eventos.find(e => e.id == id);

    if(!evento) return;

    eventoEditando = id;

    document.getElementById("novoEventoNome").value = evento.nome;
    document.getElementById("novoEventoInicio").value = evento.data_inicio;
    document.getElementById("novoEventoFim").value = evento.data_fim;
    document.getElementById("novoEventoLocal").value = evento.local;
    document.getElementById("novaDescricao").value = evento.descricao || "";
    document.getElementById("inscricaoInicio").value = evento.inicio_inscricao;
    document.getElementById("inscricaoFim").value = evento.fim_inscricao;
    const botao = document.querySelector(".btn-criar-evento");

    botao.innerText = "💾 Salvar Alterações";
}
function limparFormularioEvento(){

    eventoEditando = null;

    document.getElementById("novoEventoNome").value = "";
    document.getElementById("novoEventoLocal").value = "";
    document.getElementById("novaDescricao").value = "";
    document.getElementById("inscricaoInicio").value = "";
    document.getElementById("inscricaoFim").value = "";
    document.getElementById("novoEventoInicio").value = "";
    document.getElementById("novoEventoFim").value = "";

    document.querySelector(".btn-criar-evento").innerText = "+ Criar Evento";

}
async function excluirEvento(id){

    if(!confirm("Excluir evento?")) return;

    const resposta = await fetch("eventos.php",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body: JSON.stringify({

            acao: "excluir",

            id: id

        })

    });

    const retorno = await resposta.json();

    if(retorno.sucesso){

        renderEventos();

    }else{

        alert("Erro ao excluir evento.");

    }

}

document.addEventListener("DOMContentLoaded",()=>{

    const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));

    if(usuario?.tipo === "professor"){

        document.getElementById("painelProfessorEventos").style.display = "block";

    }

    renderEventos();

});

</script>

</body>
</html>
