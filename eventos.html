<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Eventos - Jogos Escolares</title>
<link rel="stylesheet" href="style.css">

<script>
(function() {
    if (localStorage.getItem("temaEscuro") === "ativo") {
        document.documentElement.setAttribute("data-theme", "dark");
    }
})();

function toggleDarkMode() {
    const html = document.documentElement;
    const btn = document.getElementById("darkModeBtn");

    if (html.getAttribute("data-theme") === "dark") {
        html.removeAttribute("data-theme");
        localStorage.setItem("temaEscuro", "inativo");
        btn.innerText = "🌙";
    } else {
        html.setAttribute("data-theme", "dark");
        localStorage.setItem("temaEscuro", "ativo");
        btn.innerText = "☀️";
    }
}
</script>

<style>
/* =========================
   EXTRAS VISUAIS DO PAINEL
========================= */

.btn-excluir-evento{
    background:#1e293b;
    color:white;
    border:none;
    padding:10px 14px;
    border-radius:12px;
    font-weight:800;
    cursor:pointer;
    transition:0.3s;
    width:100%;
}

.btn-excluir-evento:hover{
    background:#0f172a;
    transform: translateY(-2px);
}

.event-card{
    transition:0.3s ease;
}

.event-card:hover{
    transform: translateY(-6px);
}

.event-banner{
    position:relative;
    font-size:1.4rem;
    letter-spacing:0.5px;
}

.event-body{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.event-info{
    background:var(--bg-light);
    padding:8px 12px;
    border-radius:10px;
    font-size:0.9rem;
}

.event-title{
    font-size:1.3rem;
    font-weight:900;
    color:var(--text-main);
}

/* FORMULÁRIO MAIS MODERNO */
.form-box input{
    border-radius:12px;
    border:2px solid var(--border-color);
    padding:12px;
    transition:0.3s;
}

.form-box input:focus{
    border-color:var(--vermelho);
    box-shadow:0 0 0 4px var(--vermelho-light);
}

.btn-criar-evento{
    background:var(--vermelho);
    color:white;
    border:none;
    padding:12px;
    border-radius:12px;
    font-weight:900;
    cursor:pointer;
    transition:0.3s;
}

.btn-criar-evento:hover{
    background:var(--vermelho-dark);
    transform:translateY(-2px);
}

.actions-evento{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.actions-evento button{
    flex:1;
}
</style>
</head>

<body>

<header>
    🏆 Torneios e Jogos Escolares
    <button onclick="toggleDarkMode()" class="dark-mode-toggle" id="darkModeBtn">🌙</button>
</header>

<div class="container">

    <div class="header-actions">
        <div>Gerencie e participe dos eventos escolares</div>
    </div>

    <!-- PAINEL PROFESSOR -->
    <div id="painelProfessorEventos" class="list" style="display:none;margin-bottom:20px;">

        <h3 style="margin-bottom:15px;font-weight:900;color:var(--text-main)">
            ⚙️ Gerenciar Eventos
        </h3>

        <div class="form-box">

            <input id="novoEventoNome" placeholder="Nome do evento">
            <input type="date" id="novoEventoInicio">
            <input type="date" id="novoEventoFim">
            <input id="novoEventoLocal" placeholder="Local">

            <button class="btn-criar-evento" onclick="adicionarEvento()">
                + Criar Evento
            </button>

        </div>
    </div>

    <!-- LISTA -->
    <div class="events-grid" id="listaEventos"></div>

</div>

<script>

async function obterEventos() {

    const resposta = await fetch("eventos.php");

    const eventosBanco = await resposta.json();

    return eventosBanco.map(e => ({
        id: e.id,
        nome: e.nome,
        periodo: `${e.data_inicio} até ${e.data_fim}`,
        local: e.local,
        cor: "#dc2626",
        icone: "🏆"
    }));

}

async function renderEventos(){

    const container = document.getElementById("listaEventos");
    const eventos = await obterEventos();
    const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));

    container.innerHTML = "";

    eventos.forEach(e => {

        container.innerHTML += `
        <div class="event-card">

            <div class="event-banner" style="background:${e.cor}">
                ${e.icone} ${e.nome}
                <span class="event-badge">ABERTO</span>
            </div>

            <div class="event-body">

                <div class="event-title">${e.nome}</div>

                <div class="event-info">📅 ${e.periodo}</div>
                <div class="event-info">📍 ${e.local}</div>

                <button class="btn-inscrever"
                        style="background:${e.cor}"
                        onclick="selecionarEvento('${e.nome}')">
                    Participar
                </button>

                ${
                    usuario?.tipo === "professor"
                    ? `
                    <div class="actions-evento">

                        <button class="btn-logout"
                                onclick="editarEvento(${e.id})">
                            ✏️ Editar
                        </button>

                        <button class="btn-excluir-evento"
                                onclick="excluirEvento(${e.id})">
                            🗑 Excluir
                        </button>

                    </div>`
                    : ""
                }

            </div>
        </div>`;
    });
}

    const resposta = await fetch("eventos.php");

    const eventosBanco = await resposta.json();

    return eventosBanco.map(e => ({

            <div class="event-banner" style="background:${e.cor}">
                ${e.icone} ${e.nome}
                <span class="event-badge">ABERTO</span>
            </div>

            <div class="event-body">

                <div class="event-title">${e.nome}</div>

                <div class="event-info">📅 ${e.periodo}</div>
                <div class="event-info">📍 ${e.local}</div>

                <button class="btn-inscrever"
                        style="background:${e.cor}"
                        onclick="selecionarEvento('${e.nome}')">
                    Participar
                </button>

                ${
                    usuario?.tipo === "professor"
                    ? `
                    <div class="actions-evento">

                        <button class="btn-logout"
                                onclick="editarEvento(${e.id})">
                            ✏️ Editar
                        </button>

                        <button class="btn-excluir-evento"
                                onclick="excluirEvento(${e.id})">
                            🗑 Excluir
                        </button>

                    </div>`
                    : ""
                }

            </div>
        </div>`;
    });
}

async function obterEventos() {

    const resposta = await fetch("eventos.php");
    const eventosBanco = await resposta.json();

    return eventosBanco.map(e => ({
        id: e.id,
        nome: e.nome,
        periodo: `${e.data_inicio} até ${e.data_fim}`,
        local: e.local,
        cor: "#dc2626",
        icone: "🏆"
    }));

}

async function renderEventos(){

    const container = document.getElementById("listaEventos");
    const eventos = await obterEventos();
    const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));

    container.innerHTML = "";

    eventos.forEach(e => {

        container.innerHTML += `
        <div class="event-card">

            <div class="event-banner" style="background:${e.cor}">
                ${e.icone} ${e.nome}
                <span class="event-badge">ABERTO</span>
            </div>

            <div class="event-body">

                <div class="event-title">${e.nome}</div>

                <div class="event-info">📅 ${e.periodo}</div>
                <div class="event-info">📍 ${e.local}</div>

                <button
                    class="btn-inscrever"
                    style="background:${e.cor}"
                    onclick="selecionarEvento(${e.id}, '${e.nome}')">
                    Participar
                </button>

                ${
                    usuario?.tipo === "professor"
                    ? `
                    <div class="actions-evento">

                        <button class="btn-logout"
                                onclick="editarEvento(${e.id})">
                            ✏️ Editar
                        </button>

                        <button class="btn-excluir-evento"
                                onclick="excluirEvento(${e.id})">
                            🗑 Excluir
                        </button>

                    </div>`
                    : ""
                }

            </div>

        </div>`;
    });

}

async function adicionarEvento(){

    const nome = document.getElementById("novoEventoNome").value.trim();
    const inicio = document.getElementById("novoEventoInicio").value;
    const fim = document.getElementById("novoEventoFim").value;
    const local = document.getElementById("novoEventoLocal").value.trim();

    if(!nome || !inicio || !fim || !local){
        alert("Preencha todos os campos.");
        return;
    }

    const resposta = await fetch("eventos.php",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            acao:"criar",

            nome:nome,

            local:local,

            inicio:inicio,

            fim:fim

        })

    });

    const retorno = await resposta.json();

    if(retorno.sucesso){

        alert("Evento criado com sucesso!");

        document.getElementById("novoEventoNome").value="";
        document.getElementById("novoEventoInicio").value="";
        document.getElementById("novoEventoFim").value="";
        document.getElementById("novoEventoLocal").value="";

        renderEventos();

    }else{

        alert("Erro ao criar evento.");

    }

}

async function editarEvento(id){

    const eventos = await obterEventos();

    const e = eventos.find(x => x.id == id);

    if(!e) return;

    const nome = prompt("Nome do evento:", e.nome);
    if(nome === null) return;

    const local = prompt("Local:", e.local);
    if(local === null) return;

    const inicio = prompt("Data inicial (AAAA-MM-DD):", e.periodo.split(" até ")[0]);
    if(inicio === null) return;

    const fim = prompt("Data final (AAAA-MM-DD):", e.periodo.split(" até ")[1]);
    if(fim === null) return;

    const resposta = await fetch("eventos.php",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            acao:"editar",

            id:id,

            nome:nome,

            local:local,

            inicio:inicio,

            fim:fim

        })

    });

    const retorno = await resposta.json();

    if(retorno.sucesso){

        alert("Evento atualizado!");

        renderEventos();

    }else{

        alert("Erro ao atualizar.");

    }

}

async function excluirEvento(id){

    if(!confirm("Deseja realmente excluir este evento?")){
        return;
    }

    const resposta = await fetch("eventos.php",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            acao:"excluir",

            id:id

        })

    });

    const retorno = await resposta.json();

    if(retorno.sucesso){

        alert("Evento excluído!");

        renderEventos();

    }else{

        alert("Erro ao excluir.");

    }

}

function selecionarEvento(id, nome){

    localStorage.setItem("eventoSelecionado", JSON.stringify({
        id:id,
        nome:nome
    }));

    window.location.href = "login.html";

}

document.addEventListener("DOMContentLoaded", () => {

    const painel = document.getElementById("painelProfessorEventos");
    const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));

    if(painel && usuario?.tipo === "professor"){
        painel.style.display = "block";
    }

    renderEventos();

});
</script>

</body>
</html>
