<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        ⚽ Sistema de Jogos Escolares
        <button onclick="toggleDarkMode()" class="dark-mode-toggle" id="darkModeBtn">🌙</button>
    </header>
    <div class="container">
        <div style="background: var(--vermelho-light); color: var(--vermelho); padding: 12px 20px; border-radius: 16px; margin-bottom: 1.5rem; font-weight: 700; box-shadow: var(--shadow);">
            📌 Inscrições para: <span id="nomeEventoAtual">Carregando...</span>
        </div>
        <div class="header-actions">
            <div>Bem-vindo, <strong id="nomeExibicao">...</strong></div>
            <div>
                <button onclick="window.location.href='eventos.html'" class="btn-logout" style="margin-right:8px;">Trocar Evento</button>
                <button onclick="logout()" class="btn-logout">Sair</button>
            </div>
        </div>
        
        <!-- Grid de Estatísticas -->
        <div class="dashboard-stats">
            <div class="stat-card"><span class="stat-title">Inscritos</span><span id="totalGeral" class="stat-value">0</span></div>
            <div class="stat-card"><span class="stat-title">Vagas Livres</span><span id="vagasRestantes" class="stat-value">94</span></div>
        </div>

        <!-- Painel Central: Placar Ao Vivo Interativo -->
        <div class="list" style="text-align: center; padding: 2rem; margin-bottom: 1.5rem;">
            <h3 style="color: var(--text-main); font-weight: 800; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 8px;">
                🏆 Placar Ao Vivo
            </h3>
            
            <div style="display: flex; justify-content: center; align-items: center; gap: 3rem; margin-bottom: 1.5rem;">
                <!-- Time A -->
                <div>
                    <div id="nomeTimeA" style="font-weight: 800; font-size: 1.2rem; color: var(--text-main); margin-bottom: 5px; cursor: pointer;" onclick="alterarNomeTime('A')">2º A</div>
                    <span id="pontoTimeA" style="font-size: 4rem; font-weight: 900; color: var(--vermelho); line-height: 1;">0</span>
                </div>
                
                <!-- Divisor X -->
                <div style="font-size: 2rem; font-weight: 900; color: var(--text-sub);">X</div>
                
                <!-- Time B -->
                <div>
                    <div id="nomeTimeB" style="font-weight: 800; font-size: 1.2rem; color: var(--text-main); margin-bottom: 5px; cursor: pointer;" onclick="alterarNomeTime('B')">3º B</div>
                    <span id="pontoTimeB" style="font-size: 4rem; font-weight: 900; color: var(--vermelho); line-height: 1;">0</span>
                </div>
            </div>

            <!-- Controles do Placar (Liberados via script apenas para o Professor) -->
            <div id="controlesPlacar" style="display: none; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap;">
                <button onclick="modificarPlacar('A', 1)" style="background: var(--vermelho); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer;">+ Time A</button>
                <button onclick="modificarPlacar('A', -1)" style="background: var(--vermelho); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer;">- Time A</button>
                <button onclick="modificarPlacar('B', 1)" style="background: var(--vermelho); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer;">+ Time B</button>
                <button onclick="modificarPlacar('B', -1)" style="background: var(--vermelho); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer;">- Time B</button>
                <button onclick="resetarPlacar()" style="background: #1e293b; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer;">🔄 Resetar</button>
            </div>
        </div>

        <div class="cards">
            <div class="card active">Vôlei</div><div class="card">Handebol</div>
            <div class="card">Futsal</div><div class="card">Basquete</div>
        </div>
        <div class="sexo-toggle">
            <button class="sexo-btn active">Masculino</button>
            <button class="sexo-btn">Feminino</button>
        </div>
        <div class="form-box" id="formProfessor">
            <input type="text" id="nomeAluno" placeholder="Nome">
            <input type="text" id="turmaAluno" placeholder="Turma">
            <select id="posicaoAluno"><option>Titular</option><option>Reserva</option></select>
            <button onclick="adicionarAluno()" id="btnSalvar">Salvar</button>
        </div>
        <button onclick="adicionarAluno()" id="btnInscricaoAluno" style="display:none; margin-bottom: 20px; background: var(--vermelho); color:white; border:none; padding: 15px; border-radius: 12px; width:100%; font-weight:bold; cursor:pointer;">Inscrever-me nesta modalidade</button>
        <div class="search-container">
            <input type="text" id="busca" oninput="renderTabela()" placeholder="🔍 Buscar atleta...">
            <span id="contador" class="contador-badge">0/12 jogadores</span>
        </div>
        <div class="list">
            <table>
                <thead><tr><th>Atleta</th><th>Turma</th><th>Posição</th><th style="text-align:right">Ações</th></tr></thead>
                <tbody id="tabela-alunos"></tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
